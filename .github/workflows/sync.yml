name: Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-tsc
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.4"

      - name: Sync tsc
        id: sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run ./cmd/sync

      - name: Create pull request
        if: steps.sync.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "sync: update TypeScript tsc packages"
          branch: auto-build-output
          base: main
          title: "Sync TypeScript tsc packages"
          body: |
            Published packages were rebuilt from microsoft/TypeScript `tsc`.

      - name: Keep the schedule alive
        if: github.event_name == 'schedule' && steps.sync.outputs.changed != 'true'
        run: |
          set -euo pipefail
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          age_days=$(( (now - last) / 86400 ))
          if [ "$age_days" -lt 45 ]; then
            echo "Last commit is ${age_days} days old; no keepalive needed."
            exit 0
          fi
          mkdir -p .github
          date -u +%Y-%m-%dT%H:%M:%SZ > .github/sync-keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/sync-keepalive
          git commit -m "chore: keep scheduled sync alive"
          git push origin HEAD:main
